[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phdim"
version = "0.1.0"
description = "PH0 dimension estimator of Birdal et al. (NeurIPS 2021), validated on sets of known dimension"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "torch", "torchvision"]

[project.optional-dependencies]
test = ["pytest", "ripser"]
notebook = ["matplotlib", "ripser"]

[tool.setuptools]
packages = ["phdim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
